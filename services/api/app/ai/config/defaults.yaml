ai:
  knowledge:
    provider: native
    options: {}
  runtime:
    default_agent: execution
    enable_streaming: true
    enable_memory: true
    enable_planner: true
    max_parallel_tasks: 4
    max_tool_retries: 2
    default_timeout: 120
  llm:
    provider: mock
    options: {}
  retrieval:
    provider: mock
    options: {}
  embeddings:
    provider: mock
    options: {}
  vectorstore:
    provider: mock
    options: {}
  documents:
    provider: filesystem
    options: {}
  memory:
    provider: org_memory
    options: {}
  prompts:
    provider: filesystem
    options:
      root: app/ai/prompts/templates
  agents:
    provider: mock
    options: {}
