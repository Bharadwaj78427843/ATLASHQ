[project]
name = "atlas-backend"
version = "0.1.0"
description = "Atlas Platform Backend API"
requires-python = ">=3.10"
dependencies = [
    "fastapi[all]>=0.111.0",
    "uvicorn>=0.30.1",
    "sqlalchemy",
    "alembic",
    "pydantic",
    "asyncpg",
    "pytest",
    "pytest-asyncio",
    "aiosqlite"
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
